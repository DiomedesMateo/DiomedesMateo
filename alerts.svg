<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Alert feed">
  <defs>
    <clipPath id="frame"><rect width="900" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="#0b1220"/>
    <rect width="900" height="36" fill="#0f1a2e"/>
    <text x="24" y="24" font-family="'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#94a3b8">ALERT FEED · INCIDENT QUEUE</text>
    <circle cx="820" cy="18" r="5" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="835" y="22" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#f43f5e">TRIAGE</text>

    <!-- Alert rows -->
