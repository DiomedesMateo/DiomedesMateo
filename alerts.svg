      <rect x="90" y="64" width="48" height="18" rx="9" fill="#f43f5e" fill-opacity="0.2"/>
      <text x="114" y="77" text-anchor="middle" fill="#f43f5e" font-size="11" font-weight="700">CRIT</text>
