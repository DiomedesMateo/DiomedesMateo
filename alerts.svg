      <text x="114" y="122" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">HIGH</text>
      <text x="155" y="123" fill="#e2e8f0">Port scan detected</text>
      <text x="750" y="123" text-anchor="end" fill="#34d399" font-weight="600">BLOCKED</text>

      <rect x="20" y="145" width="860" height="36" rx="8" fill="#0f1a2e"/>
      <text x="36" y="168" fill="#64748b">02:41</text>
      <rect x="90" y="154" width="48" height="18" rx="9" fill="#fbbf24" fill-opacity="0.2"/>
      <text x="114" y="167" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">MED</text>
      <text x="155" y="168" fill="#e2e8f0">Login from unusual geo</text>
      <text x="750" y="168" text-anchor="end" fill="#34d399" font-weight="600">MFA ENFORCED</text>

      <rect x="20" y="190" width="860" height="36" rx="8" fill="#0f1a2e"/>
      <text x="36" y="213" fill="#64748b">02:35</text>
      <rect x="90" y="199" width="48" height="18" rx="9" fill="#fb923c" fill-opacity="0.2"/>
      <text x="114" y="212" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">HIGH</text>
      <text x="155" y="213" fill="#e2e8f0">Spam flood in ticket channel</text>
      <text x="750" y="213" text-anchor="end" fill="#34d399" font-weight="600">TIMEOUT</text>

      <rect x="20" y="235" width="860" height="36" rx="8" fill="#0f1a2e"/>
      <text x="36" y="258" fill="#64748b">02:31</text>
      <rect x="90" y="244" width="48" height="18" rx="9" fill="#fbbf24" fill-opacity="0.2"/>
      <text x="114" y="257" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">MED</text>
      <text x="155" y="258" fill="#e2e8f0">Failed RCON authentication</text>
      <text x="750" y="258" text-anchor="end" fill="#34d399" font-weight="600">BANNED</text>
    </g>
    <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#1c2b47" stroke-width="1.5"/>
  </g>
