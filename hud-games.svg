<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Juegos favoritos">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0f1a2e"/><stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="250" rx="16"/></clipPath>
    
    <linearGradient id="fav" x1="0" y1="0" x2="1" y2="1">
