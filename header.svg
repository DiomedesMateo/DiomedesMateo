<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Diomedes Mateo · HUD Radar SOC">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="#0b1220"/>
    <!-- Radar rings -->
    <g transform="translate(700 140)">
      <circle r="110" fill="none" stroke="#1c2b47" stroke-width="1"/>
      <circle r="80" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1"/>
      <circle r="50" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle r="20" fill="#22d3ee" fill-opacity="0.15"/>
      <!-- Sweep -->
      <path d="M0 0 L0 -110 A110 110 0 0 1 95 -55 Z" fill="#22d3ee" fill-opacity="0.12">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#22d3ee" filter="url(#glow)"/>
    </g>
    <!-- Title -->
    <text x="40" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#name)" filter="url(#glow)">DIOMEDES MATEO</text>
    <text x="40" y="148" font-family="'SF Mono', Consolas, monospace" font-size="16" fill="#94a3b8" letter-spacing="1.5">BLUE TEAM STUDENT  ·  SOC MINDSET  ·  DISCORD BOT DEV</text>
    <!-- Status line -->
    <g font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#64748b">
      <circle cx="50" cy="190" r="5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="65" y="194">STATUS: ARMED</text>
      <text x="200" y="194">MODE: DEFENSE</text>
      <text x="340" y="194">FOCUS: DETECT · RESPOND</text>
    </g>
    <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>