<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Diomedes Mateo · Operator">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="#070b14"/>
    <rect width="900" height="320" fill="url(#grid)"/>
    <!-- Scan line -->
    <rect width="900" height="2" fill="#22d3ee" opacity="0.15">
      <animate attributeName="y" values="0;320" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Decorative circles -->
    <g transform="translate(760 90)" opacity="0.6">
      <circle r="70" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="48" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="24" fill="#22d3ee" fill-opacity="0.08"/>
    </g>

    <!-- Name -->
    <text x="50" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">DIOMEDES</text>
    <text x="50" y="185" font-family="'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">MATEO</text>

    <text x="50" y="230" font-family="'SF Mono', Consolas, monospace" font-size="15" fill="#94a3b8" letter-spacing="2">BLUE TEAM  ·  SOC MINDSET  ·  DISCORD BOT DEV</text>

    <!-- Status pills -->
    <g font-family="'SF Mono', Consolas, monospace" font-size="11">
      <rect x="50" y="255" width="90" height="24" rx="12" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
      <circle cx="64" cy="267" r="4" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="76" y="271" fill="#22d3ee">LIVE</text>

      <rect x="155" y="255" width="110" height="24" rx="12" fill="none" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="170" y="271" fill="#a78bfa">DEFENSE</text>

      <rect x="280" y="255" width="130" height="24" rx="12" fill="none" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="295" y="271" fill="#f472b6">24/7 LEARNING</text>
    </g>

    <rect x="1" y="1" width="898" height="318" rx="17" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>