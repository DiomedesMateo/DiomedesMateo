<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Bio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#120020"/>
      <stop offset="1" stop-color="#200030"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="180" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="180" fill="url(#bg)"/>
    <text x="40" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#ff2d95" font-weight="700">WHO I AM</text>
    <text x="40" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#e0e0ff">Estudiante de ciberseguridad. Blue Team. Mentalidad SOC.</text>
    <text x="40" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#c0c0e0">Análisis de logs, Wireshark, SIEM y respuesta a incidentes.</text>
    <text x="40" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#c0c0e0">Bots de Discord para comunidades de Minecraft (MineOrbit).</text>
    <rect x="1" y="1" width="898" height="178" rx="11" fill="none" stroke="#ff2d95" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
</svg>