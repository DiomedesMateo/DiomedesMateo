<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-label="Capacidades: análisis y detección a la izquierda, desarrollo a la derecha">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="352" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="352" fill="#0b1220"/>
    <rect width="900" height="352" fill="url(#grid)"/>

    <rect width="900" height="40" fill="#0f1a2e"/>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#1c2b47"/>
    <text x="22" y="25" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2.5" fill="#94a3b8">CAPABILITY COVERAGE</text>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
      <text x="30" y="76" font-size="11" letter-spacing="2" fill="#22d3ee">▍ DETECTION &amp; ANALYSIS</text>
      <text x="474" y="76" font-size="11" letter-spacing="2" fill="#34d399">▍ DEVELOPMENT</text>

      <!-- Columna izquierda -->
      <g transform="translate(30 98)">
        <text y="0" font-size="13" fill="#e2e8f0">Log analysis</text><text x="396" y="0" font-size="12" fill="#22d3ee" text-anchor="end">75%</text>
        <rect y="10" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="10" height="8" rx="4" fill="url(#gBlue)"><animate attributeName="width" values="0;297;297;0" keyTimes="0;0.15;0.92;1" dur="10s" repeatCount="indefinite"/></rect>

        <text y="52" font-size="13" fill="#e2e8f0">Wireshark</text><text x="396" y="52" font-size="12" fill="#22d3ee" text-anchor="end">70%</text>
        <rect y="62" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="62" height="8" rx="4" fill="url(#gBlue)"><animate attributeName="width" values="0;0;277;277;0" keyTimes="0;0.03;0.19;0.92;1" dur="10s" repeatCount="indefinite"/></rect>

        <text y="104" font-size="13" fill="#e2e8f0">SIEM</text><text x="396" y="104" font-size="12" fill="#22d3ee" text-anchor="end">65%</text>
        <rect y="114" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="114" height="8" rx="4" fill="url(#gBlue)"><animate attributeName="width" values="0;0;257;257;0" keyTimes="0;0.06;0.23;0.92;1" dur="10s" repeatCount="indefinite"/></rect>

        <text y="156" font-size="13" fill="#e2e8f0">Incident response</text><text x="396" y="156" font-size="12" fill="#22d3ee" text-anchor="end">60%</text>
        <rect y="166" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="166" height="8" rx="4" fill="url(#gBlue)"><animate attributeName="width" values="0;0;238;238;0" keyTimes="0;0.09;0.27;0.92;1" dur="10s" repeatCount="indefinite"/></rect>
      </g>

      <!-- Columna derecha -->
      <g transform="translate(474 98)">
        <text y="0" font-size="13" fill="#e2e8f0">Python</text><text x="396" y="0" font-size="12" fill="#34d399" text-anchor="end">90%</text>
        <rect y="10" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="10" height="8" rx="4" fill="url(#gGreen)"><animate attributeName="width" values="0;356;356;0" keyTimes="0;0.17;0.92;1" dur="10s" repeatCount="indefinite"/></rect>

        <text y="52" font-size="13" fill="#e2e8f0">discord.py</text><text x="396" y="52" font-size="12" fill="#34d399" text-anchor="end">85%</text>
        <rect y="62" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="62" height="8" rx="4" fill="url(#gGreen)"><animate attributeName="width" values="0;0;337;337;0" keyTimes="0;0.03;0.2;0.92;1" dur="10s" repeatCount="indefinite"/></rect>

        <text y="104" font-size="13" fill="#e2e8f0">SQLite · aiosqlite</text><text x="396" y="104" font-size="12" fill="#34d399" text-anchor="end">75%</text>
        <rect y="114" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="114" height="8" rx="4" fill="url(#gGreen)"><animate attributeName="width" values="0;0;297;297;0" keyTimes="0;0.06;0.23;0.92;1" dur="10s" repeatCount="indefinite"/></rect>

        <text y="156" font-size="13" fill="#e2e8f0">Java · JavaScript</text><text x="396" y="156" font-size="12" fill="#34d399" text-anchor="end">55%</text>
        <rect y="166" width="396" height="8" rx="4" fill="#162238"/>
        <rect y="166" height="8" rx="4" fill="url(#gGreen)"><animate attributeName="width" values="0;0;218;218;0" keyTimes="0;0.09;0.26;0.92;1" dur="10s" repeatCount="indefinite"/></rect>
      </g>

      <line x1="450" y1="64" x2="450" y2="288" stroke="#1c2b47"/>

      <!-- Herramientas -->
      <g font-size="10" letter-spacing="1.5" fill="#64748b">
        <text x="30" y="298">TOOLS</text>
      </g>
      <g font-size="11" fill="#94a3b8">
        <rect x="30" y="308" width="64" height="22" rx="11" fill="none" stroke="#1c2b47"/><text x="62" y="323" text-anchor="middle">asyncio</text>
        <rect x="102" y="308" width="64" height="22" rx="11" fill="none" stroke="#1c2b47"/><text x="134" y="323" text-anchor="middle">Pillow</text>
        <rect x="174" y="308" width="72" height="22" rx="11" fill="none" stroke="#1c2b47"/><text x="210" y="323" text-anchor="middle">mcstatus</text>
        <rect x="254" y="308" width="108" height="22" rx="11" fill="none" stroke="#1c2b47"/><text x="308" y="323" text-anchor="middle">Components V2</text>
        <rect x="370" y="308" width="56" height="22" rx="11" fill="none" stroke="#1c2b47"/><text x="398" y="323" text-anchor="middle">Views</text>
      </g>
      <text x="870" y="324" text-anchor="end" font-size="10" fill="#475569">self-assessed · always improving</text>
    </g>

    <rect x="0.75" y="0.75" width="898.5" height="350.5" rx="13.5" fill="none" stroke="#1c2b47" stroke-width="1.5"/>
  </g>
</svg>