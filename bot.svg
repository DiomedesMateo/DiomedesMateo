<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="MineOrbit Network Discord Bot">
  <defs>
    <clipPath id="frame"><rect width="900" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="#0b1220"/>
    <rect width="900" height="36" fill="#0f1a2e"/>
    <text x="24" y="24" font-family="'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#94a3b8">MINEORBIT NETWORK · DISCORD BOT</text>
    <circle cx="820" cy="18" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="835" y="22" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#34d399">ONLINE</text>

    <text x="40" y="75" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Modules loaded</text>

    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#cbd5e1">
      <text x="40" y="110">✓ Tickets</text>
      <text x="180" y="110">✓ Moderation</text>
      <text x="340" y="110">✓ Economy</text>
      <text x="490" y="110">✓ Levels</text>
      <text x="620" y="110">✓ Staff tools</text>
    </g>

    <text x="40" y="155" font-family="'SF Mono', Consolas, monospace" font-size="13" fill="#94a3b8">Stack</text>
    <text x="120" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#e2e8f0">Python · discord.py · aiosqlite · Pillow · mcstatus</text>

    <text x="40" y="190" font-family="'SF Mono', Consolas, monospace" font-size="12" fill="#64748b">Built for Minecraft communities · tickets, moderation, economy &amp; staff tools</text>
    <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="#1c2b47" stroke-width="1.5"/>
  </g>
</svg>