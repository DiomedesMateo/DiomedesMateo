<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="MineOrbit Bot">
  <defs>
    <clipPath id="frame"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="#070b14"/>
    <rect width="900" height="36" fill="#0c1220"/>
    <text x="24" y="24" font-family="'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#64748b">MINEORBIT NETWORK</text>
    <circle cx="820" cy="18" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="835" y="22" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#34d399">ONLINE</text>

    <text x="40" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Discord Bot</text>
    <text x="40" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94a3b8">Tickets · Moderación · Economía · Niveles · Staff tools</text>

    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#cbd5e1">
      <rect x="40" y="135" width="150" height="36" rx="8" fill="#0c1220" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="55" y="158">✓ Tickets</text>

      <rect x="210" y="135" width="170" height="36" rx="8" fill="#0c1220" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="225" y="158">✓ Moderation</text>

      <rect x="400" y="135" width="150" height="36" rx="8" fill="#0c1220" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="415" y="158">✓ Economy</text>

      <rect x="570" y="135" width="140" height="36" rx="8" fill="#0c1220" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="585" y="158">✓ Levels</text>

      <rect x="730" y="135" width="130" height="36" rx="8" fill="#0c1220" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="745" y="158">✓ Staff</text>
    </g>

    <text x="40" y="200" font-family="'SF Mono', Consolas, monospace" font-size="13" fill="#64748b">Python · discord.py · aiosqlite · Pillow · mcstatus</text>
    <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  </g>
</svg>