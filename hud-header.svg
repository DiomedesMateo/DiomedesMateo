    <text x="450" y="166" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="4" fill="url(#nm)" filter="url(#glow)">DIOMEDES MATEO</text>
    <text x="450" y="204" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" letter-spacing="7" fill="#22d3ee">BLUE TEAM · SOC · DISCORD BOTS</text>

    <g font-family="'SFMono-Regular',ui-monospace,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="11" letter-spacing="2">
      <circle cx="40" cy="38" r="4" fill="#34d399"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="54" y="42" fill="#34d399">SYS · ONLINE</text>
      <text x="866" y="42" fill="#64748b" style="text-anchor:end">RADAR · 360° · ACTIVE</text>
      <text x="40" y="304" fill="#64748b">SCAN RANGE 150</text>
      <text x="866" y="304" fill="#64748b" style="text-anchor:end">THREAT LEVEL · LOW</text>
