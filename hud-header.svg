ine x1="335.1" y1="63.6" x2="332.0" y2="61.0" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="353.6" y1="45.1" x2="351.0" y2="42.0" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="375.0" y1="30.1" x2="371.0" y2="23.2" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="398.7" y1="19.0" x2="397.3" y2="15.3" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="424.0" y1="12.3" x2="423.3" y2="8.3" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="450.0" y1="10.0" x2="450.0" y2="2.0" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="476.0" y1="12.3" x2="476.7" y2="8.3" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="501.3" y1="19.0" x2="502.7" y2="15.3" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="525.0" y1="30.1" x2="529.0" y2="23.2" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="546.4" y1="45.1" x2="549.0" y2="42.0" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="564.9" y1="63.6" x2="568.0" y2="61.0" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="579.9" y1="85.0" x2="586.8" y2="81.0" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="591.0" y1="108.7" x2="594.7" y2="107.3" stroke="#22d3ee" stroke-opacity="0.5"/><line x1="597.7" y1="134.0" x2="601.7" y2="133.3" stroke="#22d3ee" stroke-opacity="0.5"/></g>
      <g>
        <path d="M0 0 L150 0 A150 150 0 0 0 100.4 -111.5 Z" fill="url(#sw)"/>
        <line x1="0" y1="0" x2="150" y2="0" stroke="#34d399" stroke-width="2" filter="url(#soft)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>
      <circle cx="96" cy="-52" r="4" fill="#f43f5e"><animate attributeName="opacity" values="0;1;0.2;0" dur="7s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="r" values="3;8;3" dur="7s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="124" cy="70" r="4" fill="#fbbf24"><animate attributeName="opacity" values="0;1;0.2;0" dur="7s" begin="3.3s" repeatCount="indefinite"/><animate attributeName="r" values="3;8;3" dur="7s" begin="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="-30" cy="-100" r="4" fill="#34d399"><animate attributeName="opacity" values="0;1;0.2;0" dur="7s" begin="5.2s" repeatCount="indefinite"/><animate attributeName="r" values="3;8;3" dur="7s" begin="5.2s" repeatCount="indefinite"/></circle>
    </g>

    <g fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9">
