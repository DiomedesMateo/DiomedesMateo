    <path d="M10 30 V10 H30 M870 10 H890 V30 M890 300 V320 H870 M30 320 H10 V300" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"><animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/></path>
    <rect x="0.75" y="0.75" width="898.5" height="328.5" rx="15.5" fill="none" stroke="#1c2b47" stroke-width="1.5"/>
