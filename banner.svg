<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Diomedes Mateo Synthwave">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0033"/>
      <stop offset="0.5" stop-color="#4a0080"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="340" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- Sky -->
    <rect width="900" height="340" fill="url(#sky)"/>
    <!-- Stars -->
    <circle cx="80" cy="40" r="1.2" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="70" r="1" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="30" r="1.4" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="1" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="90" r="1.2" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>

    <!-- Sun -->
    <circle cx="450" cy="220" r="70" fill="#ff6b35" filter="url(#glow)"/>
    <circle cx="450" cy="220" r="55" fill="#ff2d55"/>
    <rect x="380" y="190" width="140" height="8" fill="#1a0033" opacity="0.6"/>
    <rect x="380" y="210" width="140" height="6" fill="#1a0033" opacity="0.5"/>
    <rect x="380" y="226" width="140" height="4" fill="#1a0033" opacity="0.4"/>

    <!-- Grid floor -->
    <g stroke="#00f0ff" stroke-width="1" opacity="0.35" fill="none">
      <line x1="0" y1="340" x2="450" y2="220"/>
      <line x1="100" y1="340" x2="450" y2="220"/>
      <line x1="200" y1="340" x2="450" y2="220"/>
      <line x1="300" y1="340" x2="450" y2="220"/>
      <line x1="400" y1="340" x2="450" y2="220"/>
      <line x1="500" y1="340" x2="450" y2="220"/>
      <line x1="600" y1="340" x2="450" y2="220"/>
      <line x1="700" y1="340" x2="450" y2="220"/>
      <line x1="800" y1="340" x2="450" y2="220"/>
      <line x1="900" y1="340" x2="450" y2="220"/>
      <line x1="0" y1="280" x2="900" y2="280"/>
      <line x1="0" y1="300" x2="900" y2="300"/>
      <line x1="0" y1="320" x2="900" y2="320"/>
    </g>

    <!-- Name -->
    <text x="450" y="110" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="url(#name)" filter="url(#glow)" letter-spacing="4">DIOMEDES</text>
    <text x="450" y="165" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="url(#name)" filter="url(#glow)" letter-spacing="6">MATEO</text>

    <text x="450" y="200" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="14" fill="#00f0ff" letter-spacing="3">BLUE TEAM  ·  SOC  ·  DISCORD BOTS</text>
  </g>
</svg>