<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Diomedes Mateo - Blue Team Student, SOC Mindset, Discord Bot Dev">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.55" stop-color="#0a192f"/>
      <stop offset="1" stop-color="#06222e"/>
    </linearGradient>

    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7c4dff;#00ffa3;#00d4ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="sweepFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ffa3" stop-opacity="0.55"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00d4ff" stroke-opacity="0.09"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="typeclip">
      <rect x="60" y="205" height="34" width="0">
        <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.55;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="frame"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- Linea de escaneo vertical -->
    <rect x="0" y="0" width="1000" height="2" fill="#00d4ff" opacity="0.35">
      <animate attributeName="y" values="-4;322" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Paquetes de red viajando -->
    <path id="p1" d="M-20 50 C 220 10, 480 90, 1020 40" fill="none" stroke="#00d4ff" stroke-opacity="0.12" stroke-dasharray="4 8"/>
    <path id="p2" d="M-20 270 C 260 300, 560 220, 1020 280" fill="none" stroke="#7c4dff" stroke-opacity="0.15" stroke-dasharray="4 8"/>
    <circle r="3.5" fill="#00d4ff" filter="url(#softglow)">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
    </circle>
    <circle r="3" fill="#ffffff" filter="url(#softglow)">
      <animateMotion dur="6s" begin="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#7c4dff" filter="url(#softglow)">
      <animateMotion dur="7s" begin="1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
    </circle>
    <circle r="3" fill="#00ffa3" filter="url(#softglow)">
      <animateMotion dur="7s" begin="4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
    </circle>

    <!-- Radar SOC -->
    <g transform="translate(825 150)">
      <circle r="125" fill="#00d4ff" fill-opacity="0.03" stroke="#00d4ff" stroke-opacity="0.35"/>
      <circle r="84" fill="none" stroke="#00d4ff" stroke-opacity="0.25"/>
      <circle r="42" fill="none" stroke="#00d4ff" stroke-opacity="0.25"/>
      <line x1="-125" y1="0" x2="125" y2="0" stroke="#00d4ff" stroke-opacity="0.2"/>
      <line x1="0" y1="-125" x2="0" y2="125" stroke="#00d4ff" stroke-opacity="0.2"/>

      <g>
        <path d="M0 0 L125 0 A125 125 0 0 0 108.25 -62.5 Z" fill="url(#sweepFill)"/>
        <line x1="0" y1="0" x2="125" y2="0" stroke="#00ffa3" stroke-width="2" filter="url(#softglow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>

      <!-- Blips -->
      <circle cx="48" cy="-40" r="4" fill="#ff4d6d">
        <animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;7;3" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-62" cy="30" r="4" fill="#ffd93d">
        <animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;7;3" dur="4s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="75" r="4" fill="#00ffa3">
        <animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;7;3" dur="4s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-85" r="4" fill="#ff4d6d">
        <animate attributeName="opacity" values="0;1;0.2;0" dur="4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;7;3" dur="4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>

      <circle r="5" fill="#00d4ff" filter="url(#softglow)">
        <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Etiqueta de estado -->
    <g font-family="'Fira Code','Consolas',monospace" font-size="13">
      <circle cx="62" cy="52" r="5" fill="#00ffa3">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="57" fill="#00ffa3" letter-spacing="2">SOC ONLINE · MONITORING 24/7</text>
    </g>

    <!-- Titulo con glitch -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="66" letter-spacing="2">
      <text x="56" y="150" fill="#ff2d75" opacity="0">
        DIOMEDES MATEO
        <animate attributeName="opacity" values="0;0;0.8;0;0.8;0;0" keyTimes="0;0.9;0.92;0.94;0.96;0.98;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="56;50;62;56" dur="6s" keyTimes="0;0.92;0.96;1" repeatCount="indefinite"/>
      </text>
      <text x="64" y="150" fill="#00d4ff" opacity="0">
        DIOMEDES MATEO
        <animate attributeName="opacity" values="0;0;0.8;0;0.8;0;0" keyTimes="0;0.9;0.92;0.94;0.96;0.98;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="64;70;58;64" dur="6s" keyTimes="0;0.92;0.96;1" repeatCount="indefinite"/>
      </text>
      <text x="60" y="150" fill="url(#txt)" filter="url(#glow)">DIOMEDES MATEO</text>
    </g>

    <!-- Subrayado animado -->
    <rect x="60" y="168" height="3" rx="1.5" fill="#00d4ff" filter="url(#softglow)">
      <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- Rol -->
    <text x="60" y="198" font-family="'Fira Code','Consolas',monospace" font-size="15" fill="#8fb4d9" letter-spacing="4">BLUE TEAM STUDENT  //  DISCORD BOT DEV</text>

    <!-- Typing -->
    <g clip-path="url(#typeclip)">
      <text x="60" y="230" font-family="'Fira Code','Consolas',monospace" font-size="22" fill="#00d4ff">&gt; Detectar. Responder. Proteger.</text>
    </g>
    <rect x="60" y="212" width="10" height="22" fill="#00d4ff">
      <animate attributeName="x" values="60;380;380;60" keyTimes="0;0.55;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Olas inferiores -->
    <path fill="#00d4ff" fill-opacity="0.18" d="M0 292 C 250 262, 500 322, 1000 288 L1000 320 L0 320 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 292 C 250 262, 500 322, 1000 288 L1000 320 L0 320 Z;
                M0 288 C 250 322, 500 262, 1000 294 L1000 320 L0 320 Z;
                M0 292 C 250 262, 500 322, 1000 288 L1000 320 L0 320 Z"/>
    </path>
    <path fill="#7c4dff" fill-opacity="0.14" d="M0 300 C 300 280, 600 320, 1000 298 L1000 320 L0 320 Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 300 C 300 280, 600 320, 1000 298 L1000 320 L0 320 Z;
                M0 298 C 300 320, 600 280, 1000 302 L1000 320 L0 320 Z;
                M0 300 C 300 280, 600 320, 1000 298 L1000 320 L0 320 Z"/>
    </path>

    <!-- Marco con pulso -->
    <rect x="1" y="1" width="998" height="318" rx="17" fill="none" stroke="#00d4ff" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>