<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Canal de contacto">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0f1a2e"/><stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="150" rx="16"/></clipPath>
    
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="150" fill="url(#vig)"/>
    <rect width="900" height="150" fill="url(#grid)"/>
<text x="34" y="40" font-family="'SFMono-Regular',ui-monospace,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" letter-spacing="3" fill="#22d3ee">▍ 06 · CANAL DE CONTACTO</text>
    <line x1="34" y1="96" x2="866" y2="96" stroke="#22d3ee" stroke-opacity="0.25"/>
    <g stroke="#22d3ee" stroke-opacity="0.35">
      <line x1="34" y1="90" x2="34" y2="102"/><line x1="88" y1="90" x2="88" y2="102"/><line x1="142" y1="90" x2="142" y2="102"/><line x1="196" y1="90" x2="196" y2="102"/><line x1="250" y1="90" x2="250" y2="102"/><line x1="304" y1="90" x2="304" y2="102"/><line x1="358" y1="90" x2="358" y2="102"/><line x1="412" y1="90" x2="412" y2="102"/><line x1="466" y1="90" x2="466" y2="102"/><line x1="520" y1="90" x2="520" y2="102"/><line x1="574" y1="90" x2="574" y2="102"/><line x1="628" y1="90" x2="628" y2="102"/><line x1="682" y1="90" x2="682" y2="102"/><line x1="736" y1="90" x2="736" y2="102"/><line x1="790" y1="90" x2="790" y2="102"/><line x1="844" y1="90" x2="844" y2="102"/>
    </g>
    <circle cx="450" cy="96" r="30" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
    <circle cx="450" cy="96" r="15" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
    <circle r="5" cy="96" fill="#34d399" filter="url(#soft)">
      <animate attributeName="cx" values="34;866;34" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="96" r="4" fill="#22d3ee"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
    <text x="450" y="136" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#94a3b8">diomede6060@gmail.com  ·  github.com/DiomedesMateo</text>
    <path d="M10 30 V10 H30 M870 10 H890 V30 M890 120 V140 H870 M30 140 H10 V120" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"><animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/></path>
    <rect x="0.75" y="0.75" width="898.5" height="148.5" rx="15.5" fill="none" stroke="#1c2b47" stroke-width="1.5"/>
  </g>
