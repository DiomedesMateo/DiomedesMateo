<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Terminal SOC con logs en vivo">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#070f1c"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="268" rx="14" fill="url(#tbg)" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M1 15 A14 14 0 0 1 15 1 H885 A14 14 0 0 1 899 15 V40 H1 Z" fill="#112240"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="450" y="26" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#8fb4d9">diomedes@soc-node ~ /var/log</text>

  <g font-family="'Fira Code','Consolas',monospace" font-size="15">
    <text x="28" y="72" fill="#00ffa3">
      $ tail -f /var/log/auth.log
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.036;0.04;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="102" fill="#8fb4d9">
      [02:46:11] sshd: Failed password for root from 185.220.101.4
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.143;0.148;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="132" fill="#8fb4d9">
      [02:46:12] sshd: Failed password for root from 185.220.101.4
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.205;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="162" fill="#ff4d6d" filter="url(#g)">
      [02:46:12] ALERT ▸ brute-force detectado (regla 5710)
      <animate attributeName="opacity" values="0;0;1;0.4;1;1;0" keyTimes="0;0.286;0.29;0.31;0.33;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="192" fill="#00ffa3">
      [02:46:13] ✔ IP bloqueada · ticket #1042 creado
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.393;0.398;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="222" fill="#00d4ff">
      $ python bot.py
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.536;0.54;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="250" fill="#ffd93d">
      [MineOrbit] bot online · tickets OK · 0 errores
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.679;0.684;0.95;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="28" y="238" width="9" height="16" fill="#00d4ff" opacity="0.9">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>