    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0f1a2e"/><stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="300" rx="16"/></clipPath>
    
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#vig)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
<text x="34" y="40" font-family="'SFMono-Regular',ui-monospace,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" letter-spacing="3" fill="#22d3ee">▍ 01 · SOBRE MÍ</text><text x="34" y="78" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e2e8f0">Estudiante de ciberseguridad enfocado en Blue Team. Trabajo con mentalidad SOC:</text><text x="34" y="104" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e2e8f0">análisis de logs, Wireshark, SIEM y respuesta a incidentes. También desarrollo</text><text x="34" y="130" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e2e8f0">bots de Discord para comunidades de Minecraft con Python y discord.py.</text>
