<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sobre mí">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
