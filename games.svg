<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Games">
  <defs>
    <clipPath id="frame"><rect width="900" height="220" rx="16"/></clipPath>
    <linearGradient id="favGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="#070b14"/>
    <rect width="900" height="36" fill="#0c1220"/>
    <text x="24" y="24" font-family="'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#64748b">LOADOUT · GAMES</text>

    <!-- Favorite -->
    <rect x="30" y="55" width="220" height="140" rx="14" fill="url(#favGlow)" stroke="#f43f5e" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.9;0.35;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="85" font-family="'SF Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#f43f5e">★ FAVORITE</text>
    <text x="48" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Cult of the</text>
    <text x="48" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Lamb</text>

    <!-- Grid -->
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#e2e8f0">
      <rect x="270" y="55" width="140" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="285" y="90">Hollow Knight</text>

      <rect x="420" y="55" width="140" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="435" y="90">Silksong</text>

      <rect x="570" y="55" width="140" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="585" y="90">Celeste</text>

      <rect x="720" y="55" width="150" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="735" y="90">Cuphead</text>

      <rect x="270" y="130" width="200" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="285" y="165">Five Nights at Freddy's</text>

      <rect x="480" y="130" width="170" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="495" y="165">Nuclear Throne</text>

      <rect x="660" y="130" width="210" height="60" rx="10" fill="#0c1220" stroke="#1e293b"/>
      <text x="675" y="165">Minecraft · MineOrbit</text>
    </g>
    <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  </g>
</svg>