<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Games inventory">
  <defs>
    <clipPath id="frame"><rect width="900" height="200" rx="16"/></clipPath>
    <linearGradient id="fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="200" fill="#0b1220"/>
    <rect width="900" height="36" fill="#0f1a2e"/>
    <text x="24" y="24" font-family="'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#94a3b8">ASSET INVENTORY · GAMES</text>

    <!-- Favorite -->
    <rect x="20" y="55" width="200" height="120" rx="12" fill="url(#fav)" stroke="#f43f5e" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="36" y="85" font-family="'SF Mono', Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#f43f5e">★ FAVORITE</text>
    <text x="36" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Cult of the</text>
    <text x="36" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Lamb</text>

    <!-- Others -->
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#e2e8f0">
      <rect x="240" y="55" width="140" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="255" y="85">Hollow Knight</text>

      <rect x="390" y="55" width="140" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="405" y="85">Silksong</text>

      <rect x="540" y="55" width="140" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="555" y="85">Celeste</text>

      <rect x="690" y="55" width="170" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="705" y="85">Cuphead</text>

      <rect x="240" y="120" width="200" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="255" y="150">Five Nights at Freddy's</text>

      <rect x="450" y="120" width="170" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="465" y="150">Nuclear Throne</text>

      <rect x="630" y="120" width="230" height="50" rx="8" fill="#0f1a2e" stroke="#1c2b47"/>
      <text x="645" y="150">Minecraft · MineOrbit</text>
    </g>
    <rect x="1" y="1" width="898" height="198" rx="15" fill="none" stroke="#1c2b47" stroke-width="1.5"/>
  </g>
</svg>